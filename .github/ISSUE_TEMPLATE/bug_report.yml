name: Bug report
description: Report a reproducible problem in ReviewPilot.
title: "[Bug]: "
body:
  - type: markdown
    attributes:
      value: |
        Do not include API keys, access tokens, private diffs, or other sensitive information.
  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: Describe the problem and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Include the relevant direct or queued processing mode.
      placeholder: |
        1. Start the backend with ...
        2. Submit ...
        3. Observe ...
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Include OS, Python/Node versions, and relevant feature flag values. Do not paste secrets.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: Paste a redacted traceback or browser error, if available.
      render: text
    validations:
      required: false
